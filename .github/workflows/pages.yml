name: Build docs and deploy to Pages

# Run on every push to main, or manually from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions GitHub Pages needs to deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate documentation with JSDoc
        run: npx --yes jsdoc src -r -d api

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site and docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4